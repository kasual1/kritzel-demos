name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Install Angular dependencies
        working-directory: ./angular
        run: npm install

      - name: Build Angular
        working-directory: ./angular
        run: npm run build-app -- --base-href /kritzel-demos/angular/

      - name: Install React dependencies
        working-directory: ./react
        run: npm install

      - name: Build React
        working-directory: ./react
        run: npm run build-app -- --base /kritzel-demos/react/

      - name: Install Vue dependencies
        working-directory: ./vue
        run: npm install

      - name: Build Vue
        working-directory: ./vue
        run: npx vite build --base /kritzel-demos/vue/

      - name: Assemble dist-all
        run: |
          mkdir -p dist-all/angular dist-all/react dist-all/vue
          cp -r angular/dist/angular/browser/. dist-all/angular/
          cp -r react/dist/. dist-all/react/
          cp -r vue/dist/. dist-all/vue/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-all'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
